<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apprentissage Pi - V35 Typographic</title>

    <!-- Import de Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js" onerror="console.error('Erreur: Three.js n\'a pas pu être chargé.')"></script>

    <!-- Favicon (Texte pur) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ctext x='16' y='22' font-size='22' font-family='monospace' fill='black' text-anchor='middle'%3E%CF%80%3C/text%3E%3C/svg%3E">
    
    <style>
        /* --- VARIABLES --- */
        :root {
            --color-orange: #d9534f;
            --color-green: #2ecc71;
            --color-red: #c0392b;
            
            /* Light Mode */
            --bg-color: #f7f7f7;
            --text-main: #333333;
            --text-secondary: #666666;
            --panel-bg: #ffffff;
            --panel-border: #000000;
            --btn-bg: #ffffff;
            --btn-hover: #f0f0f0;
            --shadow: rgba(0,0,0,0.1);
            --input-bg: #ffffff;
            
            --tab-inactive-bg: #ffffff;
            --tab-active-bg: #333333;
            --tab-active-text: #ffffff;

            /* Shake Light */
            --shake-effect: inset 0 0 60px rgba(255, 50, 50, 0.3);
        }

        /* Dark Mode */
        [data-theme="dark"] {
            --bg-color: #121212;
            --text-main: #e0e0e0;
            --text-secondary: #aaaaaa;
            --panel-bg: #1e1e1e;
            --panel-border: #444444;
            --btn-bg: #2d2d2d;
            --btn-hover: #3d3d3d;
            --shadow: rgba(0,0,0,0.5);
            --input-bg: #2d2d2d;
            
            --tab-inactive-bg: #1e1e1e;
            --tab-active-bg: var(--color-orange);
            --tab-active-text: #ffffff;

            /* Shake Dark: Rouge sang sombre, pas de lumière */
            --shake-effect: inset 0 0 100px rgba(100, 0, 0, 0.8);
        }

        body {
            font-family: 'IBM Plex Mono', 'Courier New', monospace; /* Police monospace stricte */
            background-color: var(--bg-color);
            color: var(--text-main);
            text-align: center;
            margin: 0;
            padding: 0;
            user-select: none;
            overflow-x: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
            height: 100vh;
        }

        /* --- HEADER --- */
        .header-container {
            position: relative;
            max-width: 450px;
            margin: 0 auto;
            padding-top: 15px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        h1 {
            margin: 0;
            font-weight: 700;
            color: var(--text-main);
            font-size: 2.2em;
            line-height: 1;
            letter-spacing: -2px;
        }

        /* THEME TOGGLE (Pure CSS Shape) */
        #theme-toggle {
            position: absolute;
            right: 20px;
            top: 15px;
            background: none;
            border: 2px solid var(--text-main);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            overflow: hidden;
        }
        
        /* Le cercle intérieur change pour simuler lune/soleil */
        #theme-indicator {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: var(--text-main);
            transition: transform 0.3s ease;
        }
        
        /* État Lune (croissant) */
        [data-theme="dark"] #theme-indicator {
            transform: translateX(10px); /* Décale le rond noir pour faire un croissant */
            background-color: transparent;
            box-shadow: -8px 0 0 0 var(--text-main); /* L'ombre fait le croissant */
        }
        
        /* État Soleil (plein) */
        [data-theme="light"] #theme-indicator {
            transform: scale(0.6); /* Petit rond au milieu */
            box-shadow: none;
            background-color: var(--text-main);
        }

        /* --- TABS --- */
        .tab-container {
            display: flex;
            justify-content: center;
            margin: 15px auto 20px auto;
            max-width: 300px;
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            font-family: inherit;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            border: 2px solid var(--panel-border);
            background-color: var(--tab-inactive-bg);
            color: var(--text-main);
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .tab-btn:first-child { border-radius: 5px 0 0 5px; border-right: none; }
        .tab-btn:last-child { border-radius: 0 5px 5px 0; }
        
        .tab-btn.active {
            background-color: var(--tab-active-bg);
            color: var(--tab-active-text);
            border-color: var(--tab-active-bg);
        }

        /* --- BUTTONS --- */
        .link, .custom-btn, .control-btn, .numpad-btn {
            display: inline-block;
            margin: 10px;
            padding: 12px 20px;
            background-color: var(--btn-bg);
            color: var(--text-main);
            text-decoration: none;
            border-radius: 5px;
            cursor: pointer;
            border: 2px solid var(--panel-border);
            font-size: 1.1em;
            font-weight: bold;
            box-shadow: 3px 3px 0px var(--text-main); /* Ombre "Block" */
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }
        .link:active, .custom-btn:active, .control-btn:active, .numpad-btn:active, .numpad-btn.active-key {
            transform: translate(3px, 3px);
            box-shadow: 0px 0px 0px var(--text-main);
            background-color: var(--color-orange);
            color: white;
            border-color: var(--color-orange);
        }
        .link:hover, .custom-btn:hover, .control-btn:hover, .numpad-btn:hover {
             background-color: var(--btn-hover);
        }

        /* --- LAYOUT --- */
        #character-display-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 10px; 
            gap: 10px;
        }

        #numpad {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            justify-items: center;
            max-width: 220px;
            margin: 0 auto;
            padding: 10px;
            transform: translateX(-10px);
        }

        .display-box {
            background-color: var(--panel-bg);
            color: var(--text-main);
            border-radius: 5px;
            border: 2px solid var(--panel-border);
            box-shadow: inset 2px 2px 5px var(--shadow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        #prev-character {
            font-size: 1.5em;
            opacity: 0.6;
            width: 50px;
            height: 50px;
        }
        #character-display {
            font-size: 3em;
            width: 80px;
            height: 80px;
        }
        
        /* Biblio Boxes */
        #character-display-classic {
            font-size: 2.5em; 
            padding: 10px; 
            background-color: var(--panel-bg); 
            color: var(--text-main);
            border-radius: 5px; 
            box-shadow: inset 2px 2px 5px var(--shadow); 
            border: 2px solid var(--panel-border); 
            width: 70px; 
            height: 70px; 
            line-height: 70px;
            text-align: center;
            font-weight: bold;
        }
        .small-display {
            font-size: 1.2em;
            background-color: var(--btn-bg);
            color: var(--text-main);
            border-radius: 3px;
            width: 40px;
            height: 50px;
            line-height: 50px;
            box-shadow: inset 2px 2px 2px var(--shadow);
            border: 1px solid var(--panel-border);
            text-align: center;
            opacity: 0.8;
        }

        /* --- COUNTER & COMBO --- */
        #counter-wrapper {
            margin-top: 12px;
            margin-bottom: 8px;
            height: 32px; 
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 15px;
            width: 100%;
        }
        
        #counter {
            font-size: 1.2em;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            height: 100%;
        }

        .combo-badge {
            font-weight: bold;
            color: var(--color-orange);
            opacity: 0;
            transition: opacity 0.3s ease;
            font-size: 1.1em;
            display: flex;
            align-items: center;
            height: 100%;
            padding-top: 2px;
            gap: 8px;
        }
        .combo-visible { opacity: 1; }
        .combo-pop { animation: pop-combo 0.15s ease-out; }
        @keyframes pop-combo {
            0% { transform: scale(1); opacity: 0.8; }
            50% { transform: scale(1.1); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* --- PROGRESS & 3D --- */
        #progress-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 90%;
            max-width: 450px;
            margin: 5px auto 15px auto;
        }

        #progress-container-relative {
            flex-grow: 1;
            margin-right: 10px;
            position: relative;
            height: 10px;
        }
        
        #progress-container {
             flex-grow: 1;
             margin-right: 10px;
        }

        #mini-canvas-container {
            width: 80px;
            height: 80px;
            background: transparent;
            border-radius: 5px;
            border: 1px solid rgba(0,0,0,0.1); /* Cadre subtil pour la 3D */
            transition: filter 0.3s ease;
        }

        input[type="range"] {
            width: 100%;
            -webkit-appearance: none;
            background: linear-gradient(to right, var(--color-orange) 0%, var(--color-orange) 0%, var(--btn-bg) 0%);
            height: 10px;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
            transition: background 0.4s ease;
            display: block;
            border: 1px solid var(--panel-border);
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 10px; /* Curseur carré */
            height: 20px;
            background: var(--text-main); /* Noir/Blanc selon thème */
            border: none;
            cursor: pointer;
            position: relative;
            z-index: 2;
            border-radius: 2px;
        }

        .bar-particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background-color: var(--color-orange);
            /* Carrés pour le style */
            border-radius: 0; 
            pointer-events: none;
            opacity: 0;
            z-index: 1;
        }
        @keyframes particle-rise {
            0% { transform: translateY(0) scale(1); opacity: 0.8; }
            100% { transform: translateY(-20px) scale(0); opacity: 0; }
        }

        /* --- CARTE --- */
        #pi-grid-container {
            display: none;
            margin: 15px auto;
            width: 90%;
            max-width: 400px;
            background: var(--panel-bg);
            padding: 10px;
            border-radius: 8px;
            border: 2px solid var(--panel-border);
            box-shadow: 4px 4px 0px var(--shadow);
            max-height: 300px;
            overflow-y: auto;
        }

        #pi-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 4px;
        }

        .pi-cell {
            font-size: 0.9em;
            padding: 6px 2px;
            text-align: center;
            border-radius: 2px;
            cursor: pointer;
            transition: background 0.2s;
            color: var(--text-main);
            border: 1px solid transparent;
        }
        .pi-cell:hover { 
            background-color: var(--btn-hover); 
            border-color: var(--panel-border);
        }
        .pi-cell.active {
            background-color: var(--color-orange);
            color: white;
            font-weight: bold;
            border: 1px solid var(--text-main);
        }

        /* --- ANIMATIONS --- */
        .shake { animation: shake-pad 0.2s; }
        @keyframes shake-pad {
            0% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            50% { transform: translateX(5px); }
            75% { transform: translateX(-5px); }
            100% { transform: translateX(0); }
        }

        .screen-shake-error {
            animation: shake-screen 0.3s cubic-bezier(.36,.07,.19,.97) both;
            box-shadow: var(--shake-effect);
        }
        @keyframes shake-screen {
            10%, 90% { transform: translate3d(-2px, 0, 0); }
            20%, 80% { transform: translate3d(4px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-6px, 0, 0); }
            40%, 60% { transform: translate3d(6px, 0, 0); }
        }

        .correct { animation: correctAnimation 0.5s ease; }
        @keyframes correctAnimation {
            0% { background-color: var(--panel-bg); }
            50% { background-color: rgba(46, 204, 113, 0.3); }
            100% { background-color: var(--panel-bg); }
        }

        #buttons-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-left: 10px;
        }

        #random-mode-btn {
            font-size: 1.5em;
            background-color: var(--btn-bg);
            color: var(--text-main);
            border-radius: 5px;
            width: 50px;
            height: 50px;
            line-height: 50px;
            box-shadow: 3px 3px 0px var(--text-main);
            border: 2px solid var(--panel-border);
            margin-bottom: 10px;
            cursor: pointer;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s ease;
            font-weight: bold; /* Pour le "?" */
        }
        #random-mode-btn:active { transform: translate(3px, 3px); box-shadow: 0 0 0; }
        #random-mode-btn.active {
            background-color: var(--color-orange);
            color: #ffffff;
            border-color: var(--color-orange);
        }
        
        #controls-container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            justify-items: center;
            max-width: 220px;
            margin: 0 auto;
            padding: 10px;
            transform: translateX(-10px);
        }
        #custom-input { margin-top: 20px; }
        input[type="number"] {
            padding: 10px;
            font-size: 1em;
            border: 2px solid var(--panel-border);
            border-radius: 5px;
            background-color: var(--input-bg);
            color: var(--text-main);
            width: 150px;
            text-align: center;
            box-sizing: border-box;
            font-family: 'IBM Plex Mono', monospace;
        }
        input[type="number"]:focus { outline: none; border-color: var(--color-orange); }
        #counter-classic { margin-top: 10px; color: var(--text-secondary); font-size: 0.9em; }

        #random-decimal-container {
            display: inline-block;
            margin-left: 0px;
            text-align: center;
        }
    </style>
</head>

<body>
    <div class="header-container">
        <h1>𝞹</h1>
        <!-- THEME TOGGLE EN CSS PUR -->
        <div id="theme-toggle" onclick="toggleTheme()">
            <div id="theme-indicator"></div>
        </div>
    </div>

    <!-- NAVIGATION TABS -->
    <div class="tab-container">
        <div id="tab-gaming" class="tab-btn active" onclick="switchTab('gaming')">GAME</div>
        <div id="tab-classic" class="tab-btn" onclick="switchTab('classic')">LIBRARY</div>
    </div>

    <!-- Mode Gaming (Défaut) -->
    <div id="mode-gaming" style="display: block;">
       
       <div id="character-display-container">
            <div id="prev-character" class="display-box"></div>
            <div id="character-display" class="display-box"></div>
            <div id="buttons-container">
                <button id="restart-btn-gaming" class="numpad-btn" onclick="restartPiRecitationGaming()">&#8635;</button>
                <!-- Bouton Shuffle Typographique -->
                <button id="random-mode-btn" class="numpad-btn" onclick="toggleRandomMode()">?</button>
            </div>
        </div>

        <!-- Compact Counter Wrapper -->
        <div id="counter-wrapper">
            <span id="counter">0/500</span>
            <span id="combo-display" class="combo-badge"></span>
        </div>

        <div id="random-decimal-container" style="display: none;">
            <p id="random-decimals">Choisis ton intervalle </p>
        </div>

        <div id="progress-wrapper">
            <!-- Conteneur relatif pour positionner les particules sur la barre -->
            <div id="progress-container-relative">
                <input type="range" id="progress-bar-gaming" min="0" value="0" step="1" oninput="updateFromSliderGaming()">
            </div>
            <div id="mini-canvas-container"></div>
        </div>

        <div id="numpad">
            <button id="btn-1" class="numpad-btn" onclick="checkAnswerGaming(1)">1</button>
            <button id="btn-2" class="numpad-btn" onclick="checkAnswerGaming(2)">2</button>
            <button id="btn-3" class="numpad-btn" onclick="checkAnswerGaming(3)">3</button>
            <button id="btn-4" class="numpad-btn" onclick="checkAnswerGaming(4)">4</button>
            <button id="btn-5" class="numpad-btn" onclick="checkAnswerGaming(5)">5</button>
            <button id="btn-6" class="numpad-btn" onclick="checkAnswerGaming(6)">6</button>
            <button id="btn-7" class="numpad-btn" onclick="checkAnswerGaming(7)">7</button>
            <button id="btn-8" class="numpad-btn" onclick="checkAnswerGaming(8)">8</button>
            <button id="btn-9" class="numpad-btn" onclick="checkAnswerGaming(9)">9</button>
            <button id="btn-0" class="numpad-btn" onclick="checkAnswerGaming(0)" style="grid-column: 2;">0</button>
        </div>
    </div>

    <!-- Mode Classique (Biblio) -->
    <div id="mode-classic" style="display: none;">
        <p>Naviguez dans les décimales de 0 à 500 :</p>
        <div id="character-display-container">
            <div id="prev2-character-classic" class="small-display"></div>
            <div id="prev1-character-classic" class="small-display"></div>
            <div id="character-display-classic"></div>
            <div id="next1-character-classic" class="small-display"></div>
            <div id="next2-character-classic" class="small-display"></div>
        </div>

        <div id="custom-input">
            <input type="number" id="custom-number-classic" min="1" max="500" placeholder="Entrez un nombre (1-500)">
            <button class="custom-btn" onclick="searchDecimalClassic()">Go</button>
        </div>

        <div id="counter-classic"></div>
        
        <div id="progress-wrapper">
            <div id="progress-container" style="flex-grow: 1; margin-right: 10px;">
                <input type="range" id="progress-bar-classic" min="0" value="0" step="1" oninput="updateFromSliderClassic()">
            </div>
        </div>

        <div id="controls-container">
            <button id="prev-btn-classic" class="numpad-btn" onclick="displayPrevCharacterClassic()">&#8249;</button>
            <button id="restart-btn-classic" class="numpad-btn" onclick="restartPiRecitationClassic()">&#8635;</button>
            <button id="next-btn-classic" class="numpad-btn" onclick="displayNextCharacterClassic()">&#8250;</button>
        </div>

        <!-- Carte des décimales -->
        <div style="margin-top: 20px;">
             <button class="custom-btn" onclick="toggleGridMap()">[ # ] CARTE</button>
        </div>
        
        <div id="pi-grid-container">
            <div id="pi-grid"></div>
        </div>
    </div>

    <script>
        const piDecimals = "14159265358979323846264338327950288419716939937510582097494459230781640628620899862803482534211706798214808651328230664709384460955058223172535940812848111745028410270193852110555964462294895493038196442881097566593344612847564823378678316527120190914564856692346034861045432664821339360726024914127372458700660631558817488152092096282925409171536436789259036001133053054882046652138414695194151160943305727036575959195309218611738193261179310511854807446237996274956735188575272489122793818301194912";

        let charactersGaming = [];
        let charactersClassic = [];
        let currentIndexGaming = 0;
        let currentIndexClassic = 0;
        let isRandomModeActive = false;
        let randomDecimals = [];
        let currentAnswerIndex = 0;
        let comboCount = 0;

        /* --- THREE.JS VARIABLES --- */
        let scene, camera, renderer, outerGroup, innerMesh, particles;
        let animationId;
        
        let isErrorState = false;
        let isCharging = false;
        
        let baseRotationSpeed = 0.005;
        let currentRotationSpeed = 0.005;
        let maxRotationSpeed = 0.15;
        
        let currentLevel = -1; 

        // COULEURS
        const COLOR_ORANGE = 0xd9534f; 
        const COLOR_GREEN = 0x2ecc71;  
        const COLOR_RED = 0xc0392b;    
        
        // Variables CSS pour la lueur 3D (utilisées via getComputedStyle si besoin, ou hardcodées ici)
        const CSS_GLOW_ORANGE = 'drop-shadow(0 0 8px rgba(217, 83, 79, 0.6))';
        const CSS_GLOW_GREEN = 'drop-shadow(0 0 15px rgba(46, 204, 113, 0.8))';
        const CSS_GLOW_RED = 'drop-shadow(0 0 10px rgba(192, 57, 43, 0.8))';

        function initializeApp() {
            const savedTheme = localStorage.getItem('theme') || 'light';
            setTheme(savedTheme);

            if (typeof THREE === 'undefined') {
                console.error("Three.js n'est pas chargé.");
                return;
            }
            init3D(); 
            animate3D();
            startPiRecitationGaming();
            
            charactersClassic = piDecimals.substring(0, 500).split('');
            document.getElementById('progress-bar-classic').max = 500;
            generateGridMap();
        }

        window.onload = initializeApp;

        /* --- THEME MANAGEMENT (NO EMOJI) --- */
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme');
            const target = current === 'dark' ? 'light' : 'dark';
            setTheme(target);
        }

        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
            
            // Slider update
            updateSliderColorGaming();
            const sliderClassic = document.getElementById('progress-bar-classic');
            if(sliderClassic) {
                const val = sliderClassic.value;
                const max = sliderClassic.max;
                const percentage = (val / max) * 100;
                // Fallback color for slider inactive part
                const inactiveColor = theme === 'dark' ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.1)';
                sliderClassic.style.background = `linear-gradient(to right, var(--color-orange) ${percentage}%, ${inactiveColor} ${percentage}%)`;
            }
        }

        /* --- HELPER MAGNETISM --- */
        function applyMagneticEffect(value) {
            const threshold = 3; 
            const nearest50 = Math.round(value / 50) * 50;
            if (Math.abs(value - nearest50) <= threshold) {
                return nearest50;
            }
            return value;
        }

        /* --- SETUP THREE.JS --- */
        function init3D() {
            const container = document.getElementById('mini-canvas-container');
            const width = 80;
            const height = 80;

            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 1000);
            camera.position.z = 5;

            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);
            
            container.style.filter = CSS_GLOW_ORANGE;

            updateShapeGeometry(0); 

            createParticles();
        }

        function updateShapeGeometry(level) {
             if(level === currentLevel) return;
             currentLevel = level;
             
             if(outerGroup) {
                 scene.remove(outerGroup);
                 outerGroup.traverse(child => {
                     if(child.geometry) child.geometry.dispose();
                     if(child.material) child.material.dispose();
                 });
             }

             outerGroup = new THREE.Group();
             scene.add(outerGroup);

             let geometry;
             if (level === 0) { geometry = new THREE.BoxGeometry(1, 1, 1); } 
             else if (level === 1) { geometry = new THREE.OctahedronGeometry(0.7); } 
             else if (level === 2) { geometry = new THREE.DodecahedronGeometry(0.7); } 
             else if (level === 3) { geometry = new THREE.IcosahedronGeometry(0.7); } 
             else { geometry = new THREE.IcosahedronGeometry(0.7, 1); }

             const outerGeo = geometry.clone();
             outerGeo.scale(2.5, 2.5, 2.5);
             const outerEdges = new THREE.EdgesGeometry(outerGeo);
             const materialOuter = new THREE.LineBasicMaterial({ color: COLOR_ORANGE });
             const outerMesh = new THREE.LineSegments(outerEdges, materialOuter);
             outerGroup.add(outerMesh);

             const innerGeo = geometry.clone();
             innerGeo.scale(1.2, 1.2, 1.2);
             const materialInner = new THREE.MeshBasicMaterial({ 
                 color: COLOR_ORANGE, 
                 transparent: true, 
                 opacity: 0.6 
             });
             innerMesh = new THREE.Mesh(innerGeo, materialInner);
             
             const innerEdgesGeo = new THREE.EdgesGeometry(innerGeo);
             const innerEdgesMesh = new THREE.LineSegments(innerEdgesGeo, new THREE.LineBasicMaterial({ color: 0xffffff }));
             innerMesh.add(innerEdgesMesh);
             
             outerGroup.add(innerMesh);

             const connectorMat = new THREE.LineBasicMaterial({ color: COLOR_ORANGE, transparent: true, opacity: 0.4 });
             const posAttribute = geometry.attributes.position;
             for ( let i = 0; i < posAttribute.count; i ++ ) {
                 const v = new THREE.Vector3();
                 v.fromBufferAttribute( posAttribute, i );
                 const points = [];
                 points.push( v.clone().multiplyScalar(2.5) );
                 points.push( v.clone().multiplyScalar(1.2) );
                 const lineGeo = new THREE.BufferGeometry().setFromPoints(points);
                 const line = new THREE.Line(lineGeo, connectorMat);
                 outerGroup.add(line);
             }
        }

        function createParticles() {
            const particlesGeometry = new THREE.BufferGeometry();
            const particlesCount = 100;
            const posArray = new Float32Array(particlesCount * 3);
            const initialPosArray = new Float32Array(particlesCount * 3); 

            for(let i = 0; i < particlesCount * 3; i += 3) {
                posArray[i] = (Math.random() - 0.5) * 6;
                posArray[i+1] = (Math.random() - 0.5) * 6;
                posArray[i+2] = (Math.random() - 0.5) * 6;
                
                initialPosArray[i] = posArray[i];
                initialPosArray[i+1] = posArray[i+1];
                initialPosArray[i+2] = posArray[i+2];
            }

            particlesGeometry.setAttribute('position', new THREE.BufferAttribute(posArray, 3));
            particlesGeometry.setAttribute('initialPosition', new THREE.BufferAttribute(initialPosArray, 3));
            
            const materialParticles = new THREE.PointsMaterial({
                size: 0.1,
                color: COLOR_ORANGE,
                transparent: true,
                opacity: 0.5
            });

            particles = new THREE.Points(particlesGeometry, materialParticles);
            scene.add(particles);
        }

        function animate3D() {
            animationId = requestAnimationFrame(animate3D);
            const container = document.getElementById('mini-canvas-container');

            if (currentRotationSpeed > baseRotationSpeed) {
                currentRotationSpeed -= 0.001; 
            } else {
                currentRotationSpeed = baseRotationSpeed;
            }

            if (outerGroup && innerMesh) {
                outerGroup.rotation.x += currentRotationSpeed;
                outerGroup.rotation.y += currentRotationSpeed * 0.8;

                if (isErrorState) {
                    innerMesh.scale.setScalar(2.0); 
                    innerMesh.material.color.setHex(COLOR_RED);
                    outerGroup.children.forEach(child => {
                        if(child.material) child.material.color.setHex(COLOR_RED);
                    });
                    if(container) container.style.filter = CSS_GLOW_RED;

                } else if (isCharging) {
                    innerMesh.rotation.x -= 0.1; 
                    innerMesh.rotation.y -= 0.1;
                    innerMesh.scale.setScalar(0.8); 
                    
                    innerMesh.material.color.setHex(COLOR_ORANGE);
                     outerGroup.children.forEach(child => {
                        if(child.material) child.material.color.setHex(COLOR_ORANGE);
                    });
                    if(container) container.style.filter = CSS_GLOW_ORANGE;

                } else {
                    innerMesh.rotation.x = 0; 
                    innerMesh.rotation.y = 0;
                    innerMesh.scale.setScalar(1.0);

                    innerMesh.material.color.setHex(COLOR_ORANGE);
                    outerGroup.children.forEach(child => {
                        if(child.material) child.material.color.setHex(COLOR_ORANGE);
                    });
                    if(container) container.style.filter = CSS_GLOW_ORANGE;
                }
            }

            if (particles) {
                const positions = particles.geometry.attributes.position.array;
                const initialPositions = particles.geometry.attributes.initialPosition.array;

                if (isCharging && !isErrorState) {
                    particles.material.color.setHex(COLOR_ORANGE); 
                    for(let i = 0; i < positions.length; i += 3) {
                        positions[i] *= 0.8;   
                        positions[i+1] *= 0.8; 
                        positions[i+2] *= 0.8; 

                        if (Math.abs(positions[i]) < 0.1 && Math.abs(positions[i+1]) < 0.1) {
                             positions[i] = (Math.random() - 0.5) * 6;
                             positions[i+1] = (Math.random() - 0.5) * 6;
                             positions[i+2] = (Math.random() - 0.5) * 6;
                        }
                    }
                } else {
                    particles.material.color.setHex(COLOR_ORANGE);
                    for(let i = 0; i < positions.length; i += 3) {
                        positions[i] += (initialPositions[i] - positions[i]) * 0.05;
                        positions[i+1] += (initialPositions[i+1] - positions[i+1]) * 0.05;
                        positions[i+2] += (initialPositions[i+2] - positions[i+2]) * 0.05;
                    }
                    particles.rotation.y -= 0.002;
                }
                particles.geometry.attributes.position.needsUpdate = true;
            }

            renderer.render(scene, camera);
        }

        function triggerChargingEffect() {
            isCharging = true;
            setTimeout(() => { isCharging = false; }, 500);
            spawnProgressBarParticles();
        }
        
        function spawnProgressBarParticles() {
            const container = document.getElementById('progress-container-relative');
            const slider = document.getElementById('progress-bar-gaming');
            const percentage = (slider.value / slider.max);
            const filledWidth = container.offsetWidth * percentage;
            
            for(let i=0; i<8; i++) {
                const particle = document.createElement('div');
                particle.classList.add('bar-particle');
                const randomX = Math.random() * filledWidth;
                const randomY = (Math.random() * 10); 
                particle.style.left = randomX + 'px';
                particle.style.top = (randomY - 5) + 'px'; 
                particle.style.animation = `particle-rise ${0.4 + Math.random()*0.4}s ease-out forwards`;
                container.appendChild(particle);
                setTimeout(() => { particle.remove(); }, 1000);
            }
        }

        function triggerScreenShake() {
            document.body.classList.add('screen-shake-error');
            setTimeout(() => {
                document.body.classList.remove('screen-shake-error');
            }, 300);
        }

        function updateCombo(isCorrect) {
            const comboDisplay = document.getElementById('combo-display');
            if (isCorrect) {
                comboCount++;
                if (comboCount > 1) {
                    // UTILISATION DE L'ICONE TYPO ETOILE
                    comboDisplay.innerHTML = `| Combo x${comboCount} <span style="color:var(--color-orange); font-size:1.2em;">★</span>`;
                    comboDisplay.classList.add('combo-visible');
                    comboDisplay.classList.remove('combo-pop');
                    void comboDisplay.offsetWidth;
                    comboDisplay.classList.add('combo-pop');
                }
            } else {
                comboCount = 0;
                comboDisplay.classList.remove('combo-visible');
                comboDisplay.textContent = "";
            }
        }

        /* --- GESTION CLAVIER --- */
        document.addEventListener('keydown', function(event) {
            const modeGaming = document.getElementById('mode-gaming').style.display !== 'none';
            
            if (modeGaming && event.key >= '0' && event.key <= '9') {
                const num = parseInt(event.key);
                simulateButtonPress(num);
                checkAnswerGaming(num);
            } else if (!modeGaming) {
                if (event.key === "ArrowRight") displayNextCharacterClassic();
                if (event.key === "ArrowLeft") displayPrevCharacterClassic();
            }
        });

        function simulateButtonPress(num) {
            const btnId = 'btn-' + num;
            const btn = document.getElementById(btnId);
            if (btn) {
                btn.classList.add('active-key');
                setTimeout(() => { btn.classList.remove('active-key'); }, 150);
            }
        }

        /* --- NAVIGATION TABS --- */
        function switchTab(tab) {
            const gamingDiv = document.getElementById('mode-gaming');
            const classicDiv = document.getElementById('mode-classic');
            const tabGaming = document.getElementById('tab-gaming');
            const tabClassic = document.getElementById('tab-classic');

            if (tab === 'gaming') {
                gamingDiv.style.display = 'block';
                classicDiv.style.display = 'none';
                tabGaming.classList.add('active');
                tabClassic.classList.remove('active');
                
                if (!scene) { init3D(); }
                cancelAnimationFrame(animationId);
                animate3D();
                
                startPiRecitationGaming();
            } else {
                gamingDiv.style.display = 'none';
                classicDiv.style.display = 'block';
                tabGaming.classList.remove('active');
                tabClassic.classList.add('active');
                
                comboCount = 0;
                updateCombo(false);

                if (isRandomModeActive) toggleRandomMode();
                cancelAnimationFrame(animationId); 
                updateDisplayClassic();
            }
        }

        /* --- LOGIQUE JEU --- */
        function startPiRecitationGaming() {
            charactersGaming = piDecimals.substring(0, 500).split('');
            currentIndexGaming = 0;
            document.getElementById('progress-bar-gaming').max = charactersGaming.length;
            updateDisplayGaming();
        }

        function restartPiRecitationGaming() {
            currentIndexGaming = 0;
            currentAnswerIndex = 0;
            currentRotationSpeed = baseRotationSpeed;
            comboCount = 0;
            updateCombo(false);

            document.getElementById('character-display').textContent = '';
            document.getElementById('prev-character').textContent = '';
            document.getElementById('numpad').classList.remove('shake');
            
            isErrorState = false;
            updateShapeGeometry(0);

            if (isRandomModeActive) {
                generateRandomDecimals();
            } else {
                updateDisplayGaming();
            }
        }

function updateDisplayGaming() {
            let currentCharacter = '';
            let prevCharacter = '';

            // START CONTEXT
            if (currentIndexGaming === 0) {
                prevCharacter = '3';
                currentCharacter = '.';
            } else if (currentIndexGaming === 1) {
                prevCharacter = '.';
                currentCharacter = charactersGaming[0]; 
            } else {
                currentCharacter = charactersGaming[currentIndexGaming - 1] || '';
                prevCharacter = charactersGaming[currentIndexGaming - 2] || '';
            }

            document.getElementById('character-display').textContent = currentCharacter;
            document.getElementById('prev-character').textContent = prevCharacter;

            document.getElementById('counter').textContent = `${currentIndexGaming}/${charactersGaming.length}`;
            document.getElementById('progress-bar-gaming').value = currentIndexGaming;
            
            updateSliderColorGaming();
            
            const newLevel = Math.floor(currentIndexGaming / 100);
            updateShapeGeometry(newLevel);
        }

        function updateFromSliderGaming() {
            comboCount = 0;
            updateCombo(false);

            const slider = document.getElementById('progress-bar-gaming');
            let rawValue = parseInt(slider.value);
            let snappedValue = applyMagneticEffect(rawValue);
            
            if (snappedValue !== rawValue) slider.value = snappedValue;

            if (isRandomModeActive) {
                document.getElementById('counter').textContent = `${slider.value}/499`;
                updateSliderColorGaming();
            } else {
                currentIndexGaming = snappedValue;
                updateDisplayGaming();
            }
        }

        function updateSliderColorGaming() {
            const slider = document.getElementById('progress-bar-gaming');
            const percentage = (slider.value / slider.max) * 100;
            const inactiveColor = document.documentElement.getAttribute('data-theme') === 'dark' ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.1)';
            slider.style.background = `linear-gradient(to right, var(--color-orange) ${percentage}%, ${inactiveColor} ${percentage}%)`;
        }

        function toggleRandomMode() {
            comboCount = 0;
            updateCombo(false);

            isRandomModeActive = !isRandomModeActive;
            const randomModeBtn = document.getElementById('random-mode-btn');
            const randomDecimalContainer = document.getElementById('random-decimal-container');

            if (isRandomModeActive) {
                randomModeBtn.classList.add('active');
                randomDecimalContainer.style.display = 'block';
                generateRandomDecimals();
            } else {
                randomModeBtn.classList.remove('active');
                randomDecimalContainer.style.display = 'none';
                restartPiRecitationGaming();
            }
        }

        function generateRandomDecimals() {
            const maxRange = parseInt(document.getElementById('progress-bar-gaming').value);
            let safeRange = maxRange;
            if (safeRange < 7) safeRange = 7; 

            document.getElementById('character-display').textContent = '';
            document.getElementById('prev-character').textContent = '';
            currentAnswerIndex = 0;

            const randomStart = Math.floor(Math.random() * (safeRange - 6));
            randomDecimals = piDecimals.substring(randomStart, randomStart + 7).split('');
            
            document.getElementById('random-decimals').textContent = `Complète la suite : ${randomDecimals.slice(0, 5).join(' ')}`;
        }

        function checkAnswerGaming(answer) {
            const characterDisplay = document.getElementById('character-display');
            const prevCharacterDisplay = document.getElementById('prev-character');
            const numpad = document.getElementById('numpad');

            let isCorrect = false; 

            if (isRandomModeActive) {
                const correctAnswer1 = randomDecimals[5];
                const correctAnswer2 = randomDecimals[6];

                if (currentAnswerIndex === 0) {
                    if (answer == correctAnswer1) {
                        characterDisplay.textContent = answer;
                        characterDisplay.classList.add('correct');
                        currentAnswerIndex = 1;
                        setTimeout(() => characterDisplay.classList.remove('correct'), 500);
                        isCorrect = true;
                    }
                } else if (currentAnswerIndex === 1) {
                    if (answer == correctAnswer2) {
                        prevCharacterDisplay.textContent = correctAnswer1;
                        characterDisplay.textContent = answer;
                        prevCharacterDisplay.classList.add('correct');
                        characterDisplay.classList.add('correct');

                        setTimeout(() => {
                            prevCharacterDisplay.classList.remove('correct');
                            characterDisplay.classList.remove('correct');
                        }, 500);
                        setTimeout(() => { generateRandomDecimals(); }, 600);
                        isCorrect = true;
                    }
                }
            } else {
                const correctAnswer = charactersGaming[currentIndexGaming];
                if (answer == correctAnswer) {
                    currentIndexGaming++;
                    updateDisplayGaming();
                    numpad.classList.remove('shake');
                    isCorrect = true;
                }
            }

            if (isCorrect) {
                isErrorState = false;
                triggerChargingEffect();
                updateCombo(true); 
                
                currentRotationSpeed += 0.05;
                if (currentRotationSpeed > maxRotationSpeed) currentRotationSpeed = maxRotationSpeed;

            } else {
                isErrorState = true;
                updateCombo(false); 
                triggerScreenShake();
                
                numpad.classList.remove('shake');
                void numpad.offsetWidth;
                numpad.classList.add('shake');
                
                currentRotationSpeed = baseRotationSpeed;
            }
        }

        /* --- LOGIQUE CLASSIQUE --- */
        function navigateClassic(delta) {
             // Not used
        }

        function displayNextCharacterClassic() {
            if (currentIndexClassic < 500) {
                currentIndexClassic++;
                updateDisplayClassic();
            }
        }

        function displayPrevCharacterClassic() {
            if (currentIndexClassic > 0) {
                currentIndexClassic--;
                updateDisplayClassic();
            }
        }

        function updateDisplayClassic() {
            let mainChar = "", p1 = "", p2 = "";
            
            if (currentIndexClassic === 0) {
                 mainChar = ".";
                 p1 = "3";
                 p2 = "";
            } else if (currentIndexClassic === 1) {
                 mainChar = charactersClassic[0]; 
                 p1 = ".";
                 p2 = "3";
            } else {
                 mainChar = charactersClassic[currentIndexClassic - 1];
                 p1 = charactersClassic[currentIndexClassic - 2];
                 if (currentIndexClassic === 2) p2 = "."; 
                 else p2 = charactersClassic[currentIndexClassic - 3];
            }
            
            let n1 = charactersClassic[currentIndexClassic] || "";
            let n2 = charactersClassic[currentIndexClassic + 1] || "";

            document.getElementById('character-display-classic').textContent = mainChar;
            document.getElementById('prev1-character-classic').textContent = p1;
            document.getElementById('prev2-character-classic').textContent = p2;
            document.getElementById('next1-character-classic').textContent = n1;
            document.getElementById('next2-character-classic').textContent = n2;

            document.getElementById('counter-classic').textContent = `${currentIndexClassic}/500`;
            document.getElementById('progress-bar-classic').value = currentIndexClassic;
            
            const slider = document.getElementById('progress-bar-classic');
            const percentage = (slider.value / slider.max) * 100;
            const inactiveColor = document.documentElement.getAttribute('data-theme') === 'dark' ? 'rgba(255,255,255,0.2)' : 'rgba(0,0,0,0.1)';
            slider.style.background = `linear-gradient(to right, var(--color-orange) ${percentage}%, ${inactiveColor} ${percentage}%)`;
            
            updateGridHighlight();
        }

        function updateFromSliderClassic() {
            const slider = document.getElementById('progress-bar-classic');
            let rawValue = parseInt(slider.value);
            let snappedValue = applyMagneticEffect(rawValue);
            
            if (snappedValue !== rawValue) slider.value = snappedValue;

            currentIndexClassic = snappedValue;
            updateDisplayClassic();
        }

        function searchDecimalClassic() {
            const decimalIndex = document.getElementById('custom-number-classic').value;
            if (decimalIndex >= 0 && decimalIndex <= 500) {
                currentIndexClassic = parseInt(decimalIndex);
                updateDisplayClassic();
            } else {
                alert("Veuillez entrer un nombre entre 0 et 500.");
            }
        }

        function restartPiRecitationClassic() {
            currentIndexClassic = 0;
            updateDisplayClassic();
        }
        
        /* --- GRILLE --- */
        function generateGridMap() {
             const grid = document.getElementById('pi-grid');
             grid.innerHTML = "";
             
             const cell3 = document.createElement('div');
             cell3.className = 'pi-cell';
             cell3.textContent = "3.";
             cell3.onclick = () => { currentIndexClassic = 0; updateDisplayClassic(); };
             cell3.id = "cell-0";
             grid.appendChild(cell3);
             
             for(let i=0; i<500; i++) {
                  const cell = document.createElement('div');
                  cell.className = 'pi-cell';
                  cell.textContent = piDecimals[i];
                  cell.onclick = () => { currentIndexClassic = i+1; updateDisplayClassic(); };
                  cell.id = "cell-" + (i+1);
                  grid.appendChild(cell);
             }
        }
        
        function toggleGridMap() {
             const container = document.getElementById('pi-grid-container');
             if(container.style.display === 'block') {
                  container.style.display = 'none';
             } else {
                  container.style.display = 'block';
                  const active = document.querySelector('.pi-cell.active');
                  if(active) active.scrollIntoView({block: "center"});
             }
        }
        
        function updateGridHighlight() {
             const old = document.querySelector('.pi-cell.active');
             if(old) old.classList.remove('active');
             
             const current = document.getElementById("cell-" + currentIndexClassic);
             if(current) {
                  current.classList.add('active');
                  const container = document.getElementById('pi-grid-container');
                  if(container.style.display === 'block') {
                      current.scrollIntoView({block: "center", behavior: "smooth"});
                  }
             }
        }
    </script>
</body>
